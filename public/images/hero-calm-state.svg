        <text x="0" y="16" fill="#475569" font-family="monospace" font-size="10">AUDIO LATENCY (WASAPI)</text>
        <text x="0" y="44" fill="#64748B" font-family="monospace" font-size="20" font-weight="700">&lt; 5.0 ms</text>
        <text x="0" y="64" fill="#334155" font-family="monospace" font-size="10">Target: Zero Buffer Contention</text>
      </g>
      <!-- Metric 2 -->
      <g transform="translate(360, 0)">
        <text x="0" y="16" fill="#475569" font-family="monospace" font-size="10">CAPTURE STEALTH GUARANTEE</text>
        <text x="0" y="44" fill="#64748B" font-family="monospace" font-size="20" font-weight="700">100% EXCLUDED</text>
        <text x="0" y="64" fill="#334155" font-family="monospace" font-size="10">Direct OS Kernel Window Affinity</text>
      </g>
      <!-- Metric 3 -->
      <g transform="translate(720, 0)">
        <text x="0" y="16" fill="#475569" font-family="monospace" font-size="10">THINKSTRIPPER FSM LEAKAGE</text>
        <text x="0" y="44" fill="#64748B" font-family="monospace" font-size="20" font-weight="700">0 BYTES</text>
        <text x="0" y="64" fill="#334155" font-family="monospace" font-size="10">Mathematical FSM State Machine</text>
      </g>
      <!-- Metric 4 -->
      <g transform="translate(1080, 0)">
        <text x="0" y="16" fill="#475569" font-family="monospace" font-size="10">ACTIVE SYSTEM FOOTPRINT</text>
        <text x="0" y="44" fill="#64748B" font-family="monospace" font-size="20" font-weight="700">~45 MB RAM</text>
        <text x="0" y="64" fill="#334155" font-family="monospace" font-size="10">Electron + Rust Napi Direct</text>
      </g>
    </g>
