      <circle cx="28" cy="119" r="10" fill="#1E293B"/>
      <text x="28" y="123" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="10">02</text>
      <text x="52" y="112" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="600">STREAMING THINKSTRIPPER FSM</text>
      <text x="52" y="130" fill="#475569" font-family="monospace" font-size="9">&lt;think&gt; ... &lt;/think&gt; Filter State: IDLE</text>
      <text x="52" y="144" fill="#334155" font-family="monospace" font-size="9">Leakage Prevention: ARMED [0 Bytes]</text>

      <!-- Connection Arrow 2 -->
      <line x1="190" y1="152" x2="190" y2="182" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Node C: Executive Synthesis Delivery -->
      <rect x="0" y="182" width="380" height="56" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
      <circle cx="28" cy="210" r="10" fill="#1E293B"/>
      <text x="28" y="214" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="10">03</text>
      <text x="52" y="206" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="600">EXECUTIVE BULLET SYNTHESIS</text>
      <text x="52" y="224" fill="#475569" font-family="monospace" font-size="9">Overlay Dispatch: STANDBY</text>
