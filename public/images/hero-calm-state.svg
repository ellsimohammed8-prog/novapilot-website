      <text x="350" y="68" fill="#334155" font-family="monospace" font-size="9">0.00 dB</text>
    </g>

    <!-- DSP Specs Table -->
    <g transform="translate(30, 395)" font-family="monospace" font-size="11" fill="#64748B">
      <text x="0" y="20">• Format: 16-bit PCM Linear / 16,000 Hz</text>
      <text x="0" y="44">• DSP Buffer: SPSC Lock-Free Ring (Rust)</text>
      <text x="0" y="68">• Batch Window: 60ms (3 × 20ms Frames)</text>
      <text x="0" y="92">• Status: Awaiting Stream Initialization</text>
