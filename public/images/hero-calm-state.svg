    <g transform="translate(235, 170)">
      <circle cx="0" cy="0" r="90" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
      <circle cx="0" cy="0" r="60" stroke="#1E293B" stroke-width="1" fill="#0B0F19"/>
      <!-- SPSC Nodes (12 dormant segments) -->
