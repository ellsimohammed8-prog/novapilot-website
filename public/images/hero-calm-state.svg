  <g transform="translate(60, 136)">
    <rect width="470" height="520" rx="10" fill="#0F172A" fill-opacity="0.7" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Subsystem Header -->
    <path d="M 0 40 L 470 40" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="26" fill="#94A3B8" font-family="monospace" font-size="12" font-weight="600">
