      <circle cx="45" cy="-78" r="5" fill="#334155"/>
      <circle cx="78" cy="-45" r="5" fill="#334155"/>
      <circle cx="90" cy="0" r="5" fill="#334155"/>
      <circle cx="78" cy="45" r="5" fill="#334155"/>
      <circle cx="45" cy="78" r="5" fill="#334155"/>
      <circle cx="0" cy="90" r="5" fill="#334155"/>
      <circle cx="-45" cy="78" r="5" fill="#334155"/>
      <circle cx="-78" cy="45" r="5" fill="#334155"/>
      <circle cx="-90" cy="0" r="5" fill="#334155"/>
      <circle cx="-78" cy="-45" r="5" fill="#334155"/>
      <circle cx="-45" cy="-78" r="5" fill="#334155"/>
