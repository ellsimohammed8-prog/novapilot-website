<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <defs>
    <!-- Architectural grid pattern -->
    <pattern id="calm-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <pattern id="calm-subgrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-opacity="0.9"/>
    </pattern>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1600" height="900" fill="#0B0F19"/>
  <rect width="1600" height="900" fill="url(#calm-grid)"/>
  <rect width="1600" height="900" fill="url(#calm-subgrid)"/>

  <!-- Outer Viewport Calibration & Technical Border -->
  <rect x="24" y="24" width="1552" height="852" rx="12" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="3" fill="#334155"/>
  <circle cx="1576" cy="24" r="3" fill="#334155"/>
  <circle cx="24" cy="876" r="3" fill="#334155"/>
  <circle cx="1576" cy="876" r="3" fill="#334155"/>

  <!-- Calibration Marks & Coordinate Crosshairs -->
  <g stroke="#334155" stroke-width="1">
    <path d="M 800 30 L 800 46 M 800 854 L 800 870"/>
    <path d="M 30 450 L 46 450 M 1554 450 L 1570 450"/>
    <path d="M 790 450 L 810 450 M 800 440 L 800 460"/>
  </g>
  <text x="816" y="454" fill="#475569" font-family="monospace" font-size="11" letter-spacing="1">ORIGIN (0800, 0450)</text>

  <!-- Top System Status Header Bar (Dormant) -->
  <g transform="translate(60, 56)">
    <rect width="1480" height="52" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <!-- Terminal Dots -->
    <circle cx="24" cy="26" r="5" fill="#1E293B"/>
    <circle cx="42" cy="26" r="5" fill="#1E293B"/>
    <circle cx="60" cy="26" r="5" fill="#1E293B"/>
    
    <text x="86" y="31" fill="#64748B" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">
      NOVAPILOT ARCHITECTURAL BLUEPRINT // SUBSYSTEM SCHEMATIC
    </text>
    
    <!-- State Indicators (Dormant) -->
    <rect x="940" y="14" width="220" height="24" rx="4" fill="#1E293B" fill-opacity="0.4" stroke="#334155" stroke-width="0.75"/>
    <circle cx="954" cy="26" r="3.5" fill="#64748B"/>
    <text x="966" y="30" fill="#64748B" font-family="monospace" font-size="10">AUDIO CAPTURE: STANDBY</text>

    <rect x="1180" y="14" width="260" height="24" rx="4" fill="#1E293B" fill-opacity="0.4" stroke="#334155" stroke-width="0.75"/>
    <circle cx="1194" cy="26" r="3.5" fill="#64748B"/>
    <text x="1206" y="30" fill="#64748B" font-family="monospace" font-size="10">WDA_EXCLUDEFROMCAPTURE: IDLE</text>
  </g>

  <!-- Main Architecture 3-Column Schematic Grid -->
