      <rect width="410" height="125" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="24" fill="#64748B" font-family="monospace" font-size="11" font-weight="600">STEALTH BINDINGS (STANDBY):</text>
