        <text x="0" y="22">Ctrl+B         → Instant Ghost Mode Toggle</text>
        <text x="0" y="44">SetWindowDisplayAffinity(0x00000011)</text>
        <text x="0" y="66">Memory Allocation: 42.4 MB (Zero Leakage)</text>
      </g>
    </g>
