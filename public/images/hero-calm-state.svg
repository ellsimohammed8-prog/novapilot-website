      <text x="0" y="12" text-anchor="middle" fill="#334155" font-family="monospace" font-size="9">32,768 HEADROOM</text>
    </g>

    <!-- Flat Dormant Audio Waveform (Zero Signal) -->
    <g transform="translate(30, 290)">
      <rect width="410" height="80" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
      <line x1="20" y1="40" x2="390" y2="40" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2"/>
