      <text x="52" y="24" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="600">RAW LLM TOKEN INGESTION</text>
      <text x="52" y="42" fill="#475569" font-family="monospace" font-size="9">SSE Stream Buffer: IDLE</text>

      <!-- Connection Arrow 1 -->
